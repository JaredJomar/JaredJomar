name: Update profile cards

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-profile-cards.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate GitHub stats card
        uses: soulteary/github-readme-stats-action@ff8b194940a267831d546cc622df5687644ecc81
        with:
          card: stats
          options: 'username=${{ github.repository_owner }}&show_icons=true&title_color=3382ed&text_color=ffffff&icon_color=3382ed&bg_color=0f172a&hide_border=true'
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v1.0.0

      - name: Generate WakaTime card
        uses: soulteary/github-readme-stats-action@ff8b194940a267831d546cc622df5687644ecc81
        with:
          card: wakatime
          options: 'username=JaredJomar&layout=compact&title_color=3382ed&text_color=ffffff&icon_color=3382ed&bg_color=0f172a&hide_border=true'
          path: profile/wakatime.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v1.0.0

      - name: Generate top languages card
        uses: soulteary/github-readme-stats-action@ff8b194940a267831d546cc622df5687644ecc81
        with:
          card: top-langs
          options: 'username=${{ github.repository_owner }}&langs_count=10&layout=compact&title_color=3382ed&text_color=ffffff&icon_color=3382ed&bg_color=0f172a&hide_border=true'
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v1.0.0

      - name: Generate GitHub trophy card
        uses: ryo-ma/github-profile-trophy@2ba2fe648c4e9b17d66e01bec285e083ca1824d3
        with:
          username: ${{ github.repository_owner }}
          output_path: profile/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: radical

      - name: Upload generated cards
        uses: actions/upload-artifact@v4
        with:
          name: profile-cards
          path: profile/*.svg

  publish:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Download generated cards
        uses: actions/download-artifact@v4
        with:
          name: profile-cards
          path: profile

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --cached --quiet; then
            echo "Profile cards are already up to date."
            exit 0
          fi
          git commit -m "chore: refresh profile cards"
          git push
