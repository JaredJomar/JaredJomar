name: Update profile cards

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-profile-cards.yml"

permissions:
  contents: read

concurrency:
  group: profile-cards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate stats card
        uses: soulteary/github-readme-stats-action@ff8b194940a267831d546cc622df5687644ecc81
        with:
          card: stats
          options: 'username=JaredJomar&show_icons=true&title_color=3382ed&text_color=ffffff&icon_color=3382ed&bg_color=0f172a&hide_border=true'
          path: profile/stats.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}
          version: v1.0.0

      - name: Generate trophy
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: JaredJomar
          file: profile/trophy.svg
          theme: radical
          token: ${{ secrets.PROFILE_STATS_TOKEN }}

      - name: Generate WakaTime card
        uses: soulteary/github-readme-stats-action@ff8b194940a267831d546cc622df5687644ecc81
        with:
          card: wakatime
          options: 'username=JaredJomar&layout=compact&langs_count=5&title_color=3382ed&text_color=ffffff&icon_color=3382ed&bg_color=0f172a&hide_border=true'
          path: profile/wakatime.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v1.0.0

      - name: Generate top languages card
        uses: soulteary/github-readme-stats-action@ff8b194940a267831d546cc622df5687644ecc81
        with:
          card: top-langs
          options: 'username=${{ github.repository_owner }}&langs_count=10&layout=compact&title_color=3382ed&text_color=ffffff&icon_color=3382ed&bg_color=0f172a&hide_border=true'
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v1.0.0

      - name: Generate Transcriber pin card
        uses: soulteary/github-readme-stats-action@ff8b194940a267831d546cc622df5687644ecc81
        with:
          card: pin
          options: 'username=JaredJomar&repo=Transcriber&title_color=3382ed&text_color=ffffff&icon_color=3382ed&bg_color=0f172a&hide_border=true&show_owner=true'
          path: profile/pin-Transcriber.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}
          version: v1.0.0

      - name: Generate Virtual Institutional Counselor pin card
        uses: soulteary/github-readme-stats-action@ff8b194940a267831d546cc622df5687644ecc81
        with:
          card: pin
          options: 'username=JaredJomar&repo=VIC-Virtual-Institutional-Counselor&title_color=3382ed&text_color=ffffff&icon_color=3382ed&bg_color=0f172a&hide_border=true&show_owner=true'
          path: profile/pin-VIC-Virtual-Institutional-Counselor.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}
          version: v1.0.0

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: JaredJomar
          outputs: |
            profile/github-contribution-grid-snake.svg
            profile/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Copy 3D calendar into profile folder
        run: cp profile-3d-contrib/profile-night-rainbow.svg profile/3d-contrib.svg

      - name: Generate metrics infographic
        uses: lowlighter/metrics@latest
        with:
          filename: profile/metrics.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}
          output_action: none

      - name: Upload generated cards
        uses: actions/upload-artifact@v4
        with:
          name: profile-cards
          path: profile/*.svg

  publish:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Download generated cards
        uses: actions/download-artifact@v4
        with:
          name: profile-cards
          path: profile

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --cached --quiet; then
            echo "Profile cards are already up to date."
            exit 0
          fi
          git commit -m "chore: refresh profile cards"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
